services:
  - type: web
    name: modmendryx-api
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: MODMENDRYX_PUBLIC_URL
        value: https://modmendryx.pages.dev
      - key: MODMENDRYX_CORS_ORIGINS
        value: https://modmendryx.pages.dev,https://modmendryx-api.onrender.com
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: MODMENDRYX_ROLE
        value: render
      - key: MODMENDRYX_MAX_UPLOAD_MB
        value: "150"
      - key: MODMENDRYX_INFLIGHT_UPLOAD_MB
        value: "200"
      - key: MODMENDRYX_MAX_ACTIVE_JOBS
        value: "3"
      - key: MODMENDRYX_NODE_TOKEN
        sync: false
